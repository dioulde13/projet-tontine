# Nom logique de l'application (apparaît dans les logs au démarrage)
spring.application.name=cotisation

# Port HTTP sur lequel Tomcat écoute (8083 pour éviter le conflit avec l'autre projet gestion-cotisation qui utilise 8082)
server.port=${SERVER_PORT:8083}

# URL JDBC de connexion à la base MySQL : protocole jdbc:mysql, hôte, port, nom de la base "cotisation"
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cotisation}
# Utilisateur MySQL utilisé pour se connecter
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Fait créer/mettre à jour automatiquement les tables SQL à partir des entités JPA (@Entity) au démarrage
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
# Affiche dans les logs les requêtes SQL générées par Hibernate (utile pour déboguer)
spring.jpa.show-sql=true

# URL où springdoc publie la description brute de l'API au format JSON
springdoc.api-docs.path=/v3/api-docs
# URL de la page web Swagger UI (interface visuelle pour explorer/tester l'API)
springdoc.swagger-ui.path=/swagger-ui.html

# Clé secrète utilisée pour SIGNER les tokens JWT (algorithme HS256, qui exige au moins 256 bits = 32 caractères).
# ATTENTION : ceci est une valeur d'exemple pour le développement local. En production, cette clé doit être
# générée aléatoirement et jamais committée dans le code (variable d'environnement, secret manager, etc.).
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Niveau de log par défaut de Spring Boot = INFO : les logs "debug" sont normalement invisibles.
# Cette ligne active le niveau DEBUG uniquement pour NOS classes (le package gn.projet.cotisation),
# pas pour toutes les librairies (Spring, Hibernate...), qui resteraient sinon beaucoup trop verbeuses.
logging.level.gn.projet.cotisation=DEBUG

# Écrit les logs dans ce fichier, EN PLUS de la console (les deux restent actifs en même temps).
# Le dossier "logs/" est créé automatiquement au démarrage s'il n'existe pas.
logging.file.name=logs/application.log
# Taille max d'un fichier de log avant rotation (renommage en .log.1, .log.2...) : évite un fichier illimité
logging.logback.rollingpolicy.max-file-size=10MB
# Nombre de fichiers de log archivés conservés avant suppression du plus ancien
logging.logback.rollingpolicy.max-history=7
